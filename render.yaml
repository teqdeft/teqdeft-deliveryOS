# One-command deployment of the three services this product needs.
# Deploy with: render blueprint launch  (or connect the repo in the dashboard)
databases:
  - name: deliveryos-db
    databaseName: deliveryos
    plan: basic-256mb

services:
  - type: web
    name: deliveryos-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w @deliveryos/shared && npm run db:generate -w @deliveryos/api && npm run build -w @deliveryos/api
    startCommand: npm run db:deploy -w @deliveryos/api && npm start -w @deliveryos/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: deliveryos-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        fromService: { name: deliveryos-web, type: web, envVarKey: RENDER_EXTERNAL_URL }
      # Set at least one of these in the dashboard to enable AI analysis.
      # Without them the product runs with analysis disabled.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /var/data/storage
    disk:
      name: source-storage
      mountPath: /var/data
      sizeGB: 5

  - type: web
    name: deliveryos-web
    runtime: static
    buildCommand: npm ci && npm run build -w @deliveryos/shared && npm run build -w @deliveryos/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://deliveryos-api.onrender.com/api/*
      # SPA fallback so a deep link like /projects/:id/requirements resolves.
      - type: rewrite
        source: /*
        destination: /index.html
