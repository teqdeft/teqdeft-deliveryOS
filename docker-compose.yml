# The database only. The app itself runs on your machine via `npm run dev`,
# so you keep hot reload and normal debugging.
#
#   docker compose up -d      start Postgres
#   docker compose down       stop it (data is kept)
#   docker compose down -v    stop it and delete the data
services:
  db:
    image: postgres:16
    container_name: deliveryos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deliveryos
    ports:
      - '5432:5432'
    volumes:
      - deliveryos-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose waits for this before reporting the service healthy, so a
      # setup script does not race the database's first boot.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d deliveryos']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  deliveryos-pgdata:
