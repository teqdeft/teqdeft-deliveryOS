# The database only. The app itself runs on your machine via `npm run dev`,
# so you keep hot reload and normal debugging.
#
#   docker compose up -d      start MySQL
#   docker compose down       stop it (data is kept)
#   docker compose down -v    stop it and delete the data
services:
  db:
    image: mysql:8.0
    container_name: deliveryos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: deliveryos
      MYSQL_USER: deliveryos
      MYSQL_PASSWORD: deliveryos
    command:
      # utf8mb4 end to end. Source fragments carry pilcrows and em-dashes, and
      # anything narrower mangles them silently.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - '3306:3306'
    volumes:
      - deliveryos-mysqldata:/var/lib/mysql
    healthcheck:
      # Compose waits for this, so a setup script does not race MySQL's first
      # boot — which takes appreciably longer than Postgres's.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  deliveryos-mysqldata:
