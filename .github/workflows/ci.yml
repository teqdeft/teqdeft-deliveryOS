name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: deliveryos_test
          MYSQL_USER: deliveryos
          MYSQL_PASSWORD: deliveryos
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
          --health-start-period=30s
        ports: ['3306:3306']

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: deliveryos_test
      DB_USER: deliveryos
      DB_PASSWORD: deliveryos
      JWT_SECRET: ci-secret-long-enough-to-pass-validation-0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -w @deliveryos/shared
      - run: npm run db:migrate -w @deliveryos/api

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
