name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deliveryos_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deliveryos_test?schema=public
      JWT_SECRET: ci-secret-long-enough-to-pass-validation-0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -w @deliveryos/shared
      - run: npm run db:generate -w @deliveryos/api
      - run: npm run db:deploy -w @deliveryos/api

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
